name: Spring Boot Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'backend-spring-boot/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend-spring-boot/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'backend-spring-boot/pom.xml'

      - name: Build and Test with Maven
        working-directory: ./backend-spring-boot
        run: mvn clean verify

      - name: Archive build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-jar
          path: backend-spring-boot/target/*.jar
